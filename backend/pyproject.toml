[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tornado-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "litestar[standard]>=2.12",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
train = [
    "wandb>=0.17",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "cartopy>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ml"]
